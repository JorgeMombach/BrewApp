# Desenvolvimento local (SPRING_PROFILES_ACTIVE=dev no .env)
management:
  endpoint:
    health:
      show-details: always

# Contrato da API navegável em http://localhost:${BREWAPP_SERVER_PORT}/swagger-ui.html (rotas públicas só aqui)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    dev.brewapp: DEBUG
    # Todo SQL do jOOQ com os valores preenchidos ("-> with bind values"), pronto para copiar e executar (spec 7).
    # Só em desenvolvimento: o listener também registra as primeiras linhas de cada resultado
    org.jooq.tools.LoggerListener: DEBUG
